name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate journey content
        run: npm run test:content

      - name: Test
        run: npm test

      - name: Typecheck
        run: npx astro check

      - name: Build
        run: npx astro build
