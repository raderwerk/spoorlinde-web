backend:
  name: github
  repo: raderwerk/spoorlinde-web
  branch: main
  base_url: https://auth.spoorlinde.example
local_backend: true
locale: nl
publish_mode: editorial_workflow
media_folder: public/images/reizen
public_folder: /spoorlinde-web/images/reizen
collections:
  - name: reizen
    label: Reizen
    label_singular: Reis
    folder: src/content/reizen
    create: true
    delete: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: Titel, name: titel, widget: string, required: true, hint: "De herkenbare naam van de reis, bijvoorbeeld ‘Dolomieten per nachttrein’." }
      - { label: Land, name: land, widget: string, required: true, hint: "Het belangrijkste bestemmingsland, bijvoorbeeld ‘Italië’." }
      - { label: Samenvatting, name: samenvatting, widget: text, required: true, hint: "Een korte, feitelijke introductie zonder garanties of overdrijving." }
      - label: Moeilijkheid
        name: moeilijkheid
        widget: select
        required: true
        hint: "De fysieke zwaarte: makkelijk, gemiddeld of uitdagend."
        options: [makkelijk, gemiddeld, uitdagend]
      - label: Dagen
        name: dagen
        widget: list
        required: true
        min: 1
        hint: "Voeg iedere reisdag in de juiste volgorde toe."
        summary: "Dag {{fields.nummer}} — {{fields.titel}}"
        fields:
          - { label: Dagnummer, name: nummer, widget: number, value_type: int, min: 1, required: true, hint: "Het volgnummer van de dag, bijvoorbeeld 1." }
          - { label: Titel, name: titel, widget: string, required: true, hint: "Korte naam van deze dag, bijvoorbeeld ‘Aankomst in Bolzano’." }
          - { label: Beschrijving, name: beschrijving, widget: text, required: true, hint: "Wat de reiziger deze dag doet en ziet." }
          - { label: Vervoer, name: vervoer, widget: string, required: true, hint: "Het vervoer op deze dag, bijvoorbeeld ‘nachttrein en regionale trein’." }
          - { label: Bron, name: bron, widget: string, required: true, hint: "De herleidbare bron voor route- en vervoersinformatie." }
          - { label: Verblijf, name: verblijf, widget: string, required: true, hint: "Type en plaats van overnachting, bijvoorbeeld ‘familiehotel in Bolzano’." }
      - label: Vertrekdata
        name: vertrekdata
        widget: list
        required: true
        min: 1
        hint: "Minimaal één vertrekdatum is vereist om te publiceren."
        summary: "Vertrek {{fields.datum}}"
        fields:
          - { label: Datum, name: datum, widget: datetime, date_format: YYYY-MM-DD, time_format: false, format: YYYY-MM-DD, required: true, hint: "De bevestigde vertrekdatum, bijvoorbeeld 2027-05-14." }
          - { label: Bron, name: bron, widget: string, required: true, hint: "De herleidbare bron voor datum en prijzen." }
          - label: Prijsstaffels
            name: prijsstaffels
            widget: list
            required: true
            min: 1
            hint: "Minimaal één prijs in euro’s is vereist voor deze vertrekdatum."
            summary: "{{fields.omschrijving}} — € {{fields.prijs}}"
            fields:
              - { label: Omschrijving, name: omschrijving, widget: string, required: true, hint: "Voor wie deze prijs geldt, bijvoorbeeld ‘per persoon, gedeelde kamer’." }
              - { label: Prijs, name: prijs, widget: number, value_type: int, min: 1, required: true, hint: "Bedrag in hele euro’s, zonder valutateken, bijvoorbeeld 1295." }
      - { label: Reisverhaal, name: body, widget: markdown, required: true, hint: "De volledige redactionele beschrijving van de reis." }
